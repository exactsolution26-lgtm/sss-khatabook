name: Build APK

on:
  push:
    branches: [claude/peaceful-thompson-omzxu2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.sss --project-name offline_khata_app

      - name: Enable core library desugaring
        run: python3 tool/enable_desugaring.py android/app/build.gradle.kts

      - run: flutter pub get

      - run: flutter analyze lib --no-fatal-infos

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: offline-khata-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk offline-khata.apk
          gh release create "apk-${{ github.run_number }}" offline-khata.apk \
            --target "${{ github.sha }}" \
            --title "Offline Khata APK #${{ github.run_number }}" \
            --notes "Debug-signed release APK built from ${{ github.sha }}."
