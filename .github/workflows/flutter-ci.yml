name: Flutter stability checks
on:
  push:
    branches:
      - development/stability-foundation
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build APKs only after the project owner explicitly requests them
        type: boolean
        required: false
        default: false

permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Retain resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependency-lock
          path: pubspec.lock
          retention-days: 7
      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee flutter-analyze.log
      - name: Full Flutter unit tests
        id: unit_tests
        if: always()
        continue-on-error: true
        env:
          CAPTURE_DASHBOARD_PREVIEWS: 'true'
        run: |
          set -o pipefail
          timeout 600s flutter test --reporter expanded --timeout 90s 2>&1 | tee flutter-test.log
      - name: Upload analyzer and full-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyzer-and-unit-test-logs
          path: |
            flutter-analyze.log
            flutter-test.log
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce analyzer and unit-test gate
        if: always()
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          echo "Flutter analyze: $ANALYZE_OUTCOME"
          echo "Flutter tests: $TEST_OUTCOME"
          test "$ANALYZE_OUTCOME" = success && test "$TEST_OUTCOME" = success
      - name: Upload reconstructed dashboard previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-reconstruction-previews
          path: design-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: SQLite v1 migration fixture tests
        if: ${{ !cancelled() }}
        run: timeout 60s python3 -m unittest discover -s test_tools -p '*_check.py' -v
      - name: Subscriber account schema checks
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s test_tools -p 'test_subscriber_schema.py' -v
      - name: Record verification commit
        if: always()
        run: git rev-parse HEAD
      - name: Flutter Dart asset bundle build
        run: flutter build bundle --release

  platform-builds:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_android == true) || (github.event_name == 'push' && github.ref == 'refs/heads/development/stability-foundation' && contains(github.event.head_commit.message, '[release-preview]')) }}
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Generate temporary Android and Web runners
        run: flutter create --platforms=android,web --project-name offline_khata_app .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "com.example.offline_khata_app"', 'applicationId = "com.sss.khatabook.preview"')
          if 'applicationId = "com.sss.khatabook.preview"' not in s:
              raise SystemExit('Preview applicationId was not configured')
          s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          s += '\n dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text().replace('android:label="offline_khata_app"', 'android:label="SSS Khatabook Preview"')
          text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application android:allowBackup="false" android:usesCleartextTraffic="false"', 1)
          text = text.replace('</manifest>', '<queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries></manifest>')
          receivers = '<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/><receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>'
          text = text.replace('</application>', receivers + '</application>')
          manifest.write_text(text)
          for activity in Path("android/app/src/main/kotlin").rglob("MainActivity.kt"):
              activity.write_text(activity.read_text().replace("FlutterActivity", "FlutterFragmentActivity"))
          for style in Path("android/app/src/main/res").glob("values*/styles.xml"):
              style.write_text(style.read_text().replace("@android:style/Theme.Light.NoTitleBar", "Theme.AppCompat.DayNight.NoActionBar").replace("@android:style/Theme.Black.NoTitleBar", "Theme.AppCompat.DayNight.NoActionBar"))
          PY
      - name: Android release compilation (testing signature only)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/sss-universal.apk
      - name: Build smaller architecture-specific APKs
        run: |
          flutter build apk --release --split-per-abi
          cp /tmp/sss-universal.apk build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK identity and signature
        run: |
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/*release.apk; do
            echo "APK: $(basename "$apk")" >> build/app/outputs/flutter-apk/APK_SIGNATURE.txt
            "$build_tools_dir/apksigner" verify --verbose --print-certs "$apk" >> build/app/outputs/flutter-apk/APK_SIGNATURE.txt
            "$build_tools_dir/aapt" dump badging "$apk" > "${apk%.apk}.metadata.txt"
          done
          cp build/app/outputs/flutter-apk/app-release.metadata.txt build/app/outputs/flutter-apk/APK_METADATA.txt
          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile
          root=Path('build/app/outputs/flutter-apk')
          for apk in root.glob('*release.apk'):
              text=apk.with_suffix('.metadata.txt').read_text()
              assert "name='com.sss.khatabook.preview'" in text
              assert "versionName='1.0.2'" in text
              assert int(re.search(r"versionCode='(\d+)'",text).group(1))>=102
              if 'arm64-v8a' in apk.name:
                  with zipfile.ZipFile(apk) as archive:
                      arches={name.split('/')[1] for name in archive.namelist() if name.startswith('lib/') and name.endswith('.so')}
                      assert arches=={'arm64-v8a'}, arches
                  assert apk.stat().st_size < (root/'app-release.apk').stat().st_size
          print('PASS: all signed APK package/version metadata; ARM64 includes only ARM64 libraries and is smaller')
          PY
      - name: Record build identity
        run: |
          git rev-parse HEAD > build/app/outputs/flutter-apk/BUILD_COMMIT.txt
          echo 'Preview testing signature; separate package com.sss.khatabook.preview; physical-device UAT pending. See Android startup job for emulator results.' > build/app/outputs/flutter-apk/BUILD_STATUS.txt
          sha256sum build/app/outputs/flutter-apk/*.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sss-khatabook-testing-apks
          path: build/app/outputs/flutter-apk/
          retention-days: 7
      - name: Upload smaller phone APK separately
        uses: actions/upload-artifact@v4
        with:
          name: sss-khatabook-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

  web-build:
    runs-on: ubuntu-24.04
    needs: analyze-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Generate temporary Web runner
        run: flutter create --platforms=web --project-name offline_khata_app .
      - name: Use one offline worker owner
        run: cp test_tools/browser/flutter_bootstrap.js web/flutter_bootstrap.js
      - name: Resolve dependencies
        run: flutter pub get
      - name: Install SQLite browser worker and WASM
        run: dart run sqflite_common_ffi_web:setup
      - name: Web release build
        run: flutter build web --release --no-web-resources-cdn --pwa-strategy=none
      - name: Generate offline public asset shell
        run: |
          python3 test_tools/browser/offline_shell.py build/web "$GITHUB_SHA"
          node --check build/web/sss-sw.js
      - name: Install browser acceptance runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser runtime and persistence tests
        run: |
          python3 -m http.server 8080 --directory build/web > /tmp/sss-web-server.log 2>&1 &
          node test_tools/browser/smoke.cjs
      - name: Upload Web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sss-khatabook-web
          path: build/web/
          retention-days: 7
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-evidence
          path: |
            web-*.png
            web-runtime.log
            web-dom.html
          if-no-files-found: ignore

  android-startup:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_android == true) || (github.event_name == 'push' && github.ref == 'refs/heads/development/stability-foundation' && contains(github.event.head_commit.message, '[release-preview]')) }}
    runs-on: ubuntu-latest
    needs: platform-builds
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        apk_file: [app-release.apk, app-x86_64-release.apk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sss-khatabook-testing-apks
          path: apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and start Android APK
        env:
          APK_FILE: apk/${{ matrix.apk_file }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 test_tools/android/smoke.py
      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence-${{ matrix.apk_file }}
          path: android-evidence/
          if-no-files-found: ignore

  publish-preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development/stability-foundation' && contains(github.event.head_commit.message, '[release-preview]') }}
    needs: [analyze-and-test, web-build, android-startup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sss-khatabook-testing-apks
          path: apk
      - name: Prepare verified preview assets
        run: |
          mkdir release-assets
          cp apk/app-release.apk release-assets/SSS-Khatabook-1.0.2-Universal.apk
          cp apk/app-arm64-v8a-release.apk release-assets/SSS-Khatabook-1.0.2-ARM64.apk
          cp apk/app-armeabi-v7a-release.apk release-assets/SSS-Khatabook-1.0.2-ARM32.apk
          cp apk/BUILD_COMMIT.txt release-assets/BUILD_COMMIT.txt
          cp apk/APK_SIGNATURE.txt release-assets/APK_SIGNATURE.txt
          cp apk/APK_METADATA.txt release-assets/APK_METADATA.txt
          cp docs/PREVIEW_RELEASE_1_0_2.md release-assets/RELEASE_NOTES.md
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish owner-requested testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2-preview.20261104 release-assets/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "SSS Khatabook 1.0.2 — Smaller Downloads" \
            --notes-file docs/PREVIEW_RELEASE_1_0_2.md
      - name: Verify public APK downloads and resume after publishing
        run: python3 test_tools/android/verify_downloads.py release-assets v1.0.2-preview.20261104
      - name: Attach genuine download verification results
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.2-preview.20261104 release-assets/DOWNLOAD_CHECKS.json
