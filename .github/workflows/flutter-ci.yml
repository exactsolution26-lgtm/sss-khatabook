name: Flutter stability checks
on:
  push:
    branches:
      - development/stability-foundation
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: SQLite v1 migration fixture tests
        run: python3 -m unittest discover -s test_tools -p '*_check.py' -v
      - name: Subscriber account schema checks
        run: python3 -m unittest discover -s test_tools -p 'test_subscriber_schema.py' -v
      - name: Flutter Dart asset bundle build
        run: flutter build bundle --release

  platform-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate temporary Android and Web runners
        run: flutter create --platforms=android,web --project-name offline_khata_app .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          s += '\n dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY
      - name: Android debug APK build
        run: flutter build apk --debug
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sss-khatabook-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate temporary Web runner
        run: flutter create --platforms=web --project-name offline_khata_app .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Web release build
        run: flutter build web --release
      - name: Upload Web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sss-khatabook-web
          path: build/web/
          retention-days: 7
