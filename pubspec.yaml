name: offline_khata_app
description: Offline-first SSS Khatabook Flutter app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.4
  flutter_native_contact_picker: ^0.0.13
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.2
  file_selector: ^1.1.0
  share_plus: ^12.0.1
  pdf: ^3.11.3
  printing: ^5.14.2
  # pdf/archive and notifications 19 share the XML 6 dependency chain.
  # image 4.11.0 has a broken archive lower bound; this version is compatible.
  image: 4.10.2
  archive: '>=4.0.9 <4.1.0'
  speech_to_text: 7.5.0
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSansDevanagari-Regular.ttf
